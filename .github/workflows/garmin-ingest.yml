name: Garmin Ingest

# Pulls recent Garmin data into private Supabase staging tables (spec §13.2).
# Nothing is published by this job; rows land as review_state='private'.
on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Singapore time, daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install garminconnect requests
      - name: Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/garmin_ingest.py
